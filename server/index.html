<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Very cool chat app</h1>
<section id="login">
    <h2>Login</h2>
    <label for="username">User name:</label>
    <input type="text" id="username">
    <button id="join">Join</button>
</section>
<section style="display: none" id="chat-section">
    <h2 id="chatting-as">Chatting as </h2>
    <div id="chat" style="height: 400px; overflow-y: auto"></div>
    <input type="text" id="send-message" placeholder="Send message...">
    <button id="send-message-btn">Send message</button>
</section>

<script type="module">
    const ws = new WebSocket("/connect");
    const waitForConnection = new Promise(res => ws.onopen = res);

    const loginSection = document.querySelector("#login");
    const joinBtn = document.querySelector("#join");
    const usernameInput = document.querySelector("#username");

    const chattingAs = document.querySelector("#chatting-as");
    const chatSection = document.querySelector("#chat-section");
    const chat = document.querySelector("#chat");
    const sendMessageInput = document.querySelector("#send-message");
    const sendMessageButton = document.querySelector("#send-message-btn")

    await waitForConnection;

    joinBtn.onmousedown = () => {
        ws.send(usernameInput.value);
        joinBtn.disabled = true;
    }

    ws.onmessage = e => {
        if(e.data === "Username already taken") {
            alert("Username taken")
            return;
        }

        chattingAs.append(usernameInput.value);

        loginSection.style.display = "none";
        chatSection.style.display = "block";

        ws.onmessage = e => {
            const msg = document.createElement("div");
            msg.innerText = e.data;
            chat.append(msg);
        }

        sendMessageButton.onmousedown = () => {
            ws.send(sendMessageInput.value);
            sendMessageInput.value = "";
        }
    }
</script>
</body>
</html>
